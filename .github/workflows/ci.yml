name: ci

on:
  push:
    branches: ["vibe/anforderungen-1ac69e"]
  pull_request:
  workflow_dispatch:

jobs:
  # Headless-Tests der Beat-Pipeline (braucht nur numpy — sounddevice/cv2/moderngl
  # werden in den Modulen lazy importiert und sind hier nicht nötig).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - run: python -m unittest discover -s tests -v
      - run: python -m seanimation --selftest

  # Baut die standalone Windows-Exe und stellt sie als Artefakt bereit
  # (Download: PR -> Actions -> Lauf -> Artifact "SeAnimation-win64").
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller seanimation.spec --clean --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: SeAnimation-win64
          path: dist/SeAnimation*
          retention-days: 14
