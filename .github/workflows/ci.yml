name: ci

# push-Trigger absichtlich weggelassen: Läuft über pull_request (PR #1 ist offen)
# und workflow_dispatch — sonst würde der Bot-Push auf dist-exe endlos retriggern.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # nötig für Fallback: Exe auf Branch dist-exe committen

jobs:
  # Headless-Tests der Beat-Pipeline (braucht nur numpy — sounddevice/cv2/moderngl
  # werden in den Modulen lazy importiert und sind hier nicht nötig).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy soundfile
      - run: python -m unittest discover -s tests -v
      - run: python -m seanimation --selftest

  # Baut die standalone Windows-Exe (PyInstaller onefile).
  # Lieferung: 1) Artefakt SeAnimation-win64, 2) Fallback: Branch dist-exe.
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller seanimation.spec --clean --noconfirm
      - name: Exe-Größe anzeigen
        shell: pwsh
        run: |
          $f = Get-Item dist\SeAnimation.exe
          Write-Host ("SeAnimation.exe: {0:N1} MB" -f ($f.Length / 1MB))
      # Primär: Artefakt. Kann am Account-Quota scheitern -> continue-on-error,
      # damit der Job grün bleibt; der Fallback-Step greift dann über outcome.
      - name: Upload als Artefakt SeAnimation-win64
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SeAnimation-win64
          path: dist/SeAnimation*
          retention-days: 14
          if-no-files-found: error
      # Fallback bei Artifact-Quota: Exe auf Branch dist-exe committen
      # (git-Speicher statt Artifact-Speicher). Download dann per Browser:
      # https://github.com/thesepix/SeAnimation/raw/dist-exe/bin/SeAnimation.exe
      - name: Fallback — Exe auf Branch dist-exe pushen
        if: steps.upload.outcome == 'failure'
        shell: pwsh
        run: |
          $size = (Get-Item dist\SeAnimation.exe).Length
          if ($size -gt 90MB) {
            Write-Host "::warning::Exe zu groß für git-Fallback ($size Bytes, Limit 100 MB) — nur Artefakt möglich"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dist-exe 2>$null
          if ($LASTEXITCODE -eq 0) { git checkout -B dist-exe origin/dist-exe } else { git checkout -b dist-exe }
          mkdir -p bin
          Copy-Item dist\SeAnimation.exe bin\SeAnimation.exe -Force
          git add bin/SeAnimation.exe
          git commit -m "ci: SeAnimation.exe (build $env:GITHUB_SHA)" || Write-Host "nichts Neues zu committen"
          git push origin dist-exe
          Write-Host "Exe liegt auf Branch dist-exe: bin/SeAnimation.exe"
