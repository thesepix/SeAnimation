name: ci

# push-Trigger absichtlich weggelassen: Läuft über pull_request und
# workflow_dispatch — sonst würde der Bot-Push auf dist-exe endlos retriggern.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # nötig für Fallback: Exe auf Branch dist-exe committen

jobs:
  # Headless-Tests der Beat-Pipeline (braucht nur numpy — sounddevice/cv2/moderngl
  # werden in den Modulen lazy importiert und sind hier nicht nötig).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install numpy soundfile opencv-python-headless pillow
      - run: python -m unittest discover -s tests -v
      - run: python -m seanimation --selftest

  # Baut die standalone Windows-Exe (PyInstaller onefile).
  # Lieferung: 1) Artefakt SeAnimation-win64, 2) Fallback: Branch dist-exe.
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller seanimation.spec --clean --noconfirm
      - name: Exe-Größe anzeigen
        shell: pwsh
        run: |
          $f = Get-ChildItem dist\SeAnimation-*.exe
          Write-Host ("{0}: {1:N1} MB" -f $f.Name, ($f.Length / 1MB))
      # Primär: Artefakt. Kann am Account-Quota scheitern -> continue-on-error,
      # damit der Job grün bleibt; der Fallback-Step greift dann über outcome.
      - name: Upload als Artefakt SeAnimation-win64
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SeAnimation-win64
          path: dist/SeAnimation*
          retention-days: 14
          if-no-files-found: error
      # Fallback bei Artifact-Quota: Exe auf Branch dist-exe committen
      # (git-Speicher statt Artifact-Speicher). Download dann per Browser:
      # https://github.com/thesepix/SeAnimation/raw/dist-exe/bin/SeAnimation.exe
      - name: Fallback — Exe auf Branch dist-exe pushen
        if: steps.upload.outcome == 'failure'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\SeAnimation-*.exe
          $size = $exe.Length
          if ($size -gt 90MB) {
            Write-Host "::warning::Exe zu groß für git-Fallback ($size Bytes, Limit 100 MB) — nur Artefakt möglich"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dist-exe 2>$null
          if ($LASTEXITCODE -eq 0) { git checkout -B dist-exe origin/dist-exe } else { git checkout -b dist-exe }
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item $exe "bin\$($exe.Name)" -Force          # versionierter Name: SeAnimation-vX.Y.Z.exe
          Copy-Item $exe "bin\SeAnimation.exe" -Force         # latest-Alias
          git add bin/
          git commit -m "ci: $($exe.Name) (build $env:GITHUB_SHA)" || Write-Host "nichts Neues zu committen"
          git push origin dist-exe
          Write-Host "Exe liegt auf Branch dist-exe: bin/$($exe.Name) und bin/SeAnimation.exe (latest)"
