[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seanimation"
version = "0.4.5"
description = "Beat-synchrone Musik-Visuals für Windows 11 (Python + OpenGL)"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "moderngl>=5.8",
    "pyglet>=2.0",
    "pycaw; sys_platform == 'win32'",
    "comtypes; sys_platform == 'win32'",
]

[project.scripts]
seanimation = "seanimation.main:main"

[tool.setuptools.packages.find]
include = ["seanimation*"]
